# Gemini CLI Read-Only Policy
# Enforces that gemini-cli can only read files and run web search.
# Pass with: gemini --admin-policy /path/to/read-only.toml

# Default: deny all tools
[[rule]]
toolName = "*"
decision = "deny"
priority = 0
deny_message = "This tool is disabled by the gemini-research read-only policy."

# Allow reading files
[[rule]]
toolName = "read_file"
decision = "allow"
priority = 100

# Allow listing directories
[[rule]]
toolName = "list_directory"
decision = "allow"
priority = 100

# Allow web search and fetch
[[rule]]
toolName = "google_web_search"
decision = "allow"
priority = 100

[[rule]]
toolName = "web_fetch"
decision = "allow"
priority = 100

# Explicitly deny file writes (belt-and-suspenders)
[[rule]]
toolName = ["write_file", "replace", "create_file"]
decision = "deny"
priority = 200
deny_message = "File modification is disabled by the gemini-research read-only policy."

# Explicitly deny shell execution
[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 200
deny_message = "Shell execution is disabled by the gemini-research read-only policy."
